<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>greatm3</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
    <style>
      :root {
        --black: #0a0a0a;
        --white: #f5f5f3;
        --mid: #888;
        --border: #e0e0e0;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
      }

      body {
        background: var(--black);
        font-family: 'DM Sans', sans-serif;
      }

      #intro {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--black);
      }

      #big-btn {
        width: 50%;
        height: 50%;
        background: var(--black);
        border: none;
        cursor: pointer;
        font-family: 'DM Mono', monospace;
        font-size: clamp(20px, 5vw, 52px);
        font-weight: 400;
        color: var(--white);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        position: relative;
        overflow: hidden;
        transition: background 0.1s;
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }

      #big-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--white);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.6s cubic-bezier(0.77,0,0.18,1);
        z-index: 0;
      }

      #big-btn:hover::before {
        transform: scaleX(1);
      }

      #big-btn:hover {
        color: var(--black);
      }

      #big-btn .btn-text {
        position: relative;
        z-index: 1;
      }
      
      @keyframes borderPulse {
        0%, 100% { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
        50%       { box-shadow: inset 0 0 0 2px rgba(255,255,255,0.22); }
      }

      #big-btn { animation: borderPulse 2.5s ease infinite; }
      
      #flash {
        position: fixed;
        inset: 0;
        z-index: 999;
        pointer-events: none;
        opacity: 0;
      }

      
      #portfolio {
        background: var(--white);
        color: var(--black);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
        opacity: 0;
        overflow-y: auto;
        overflow-x: hidden;
      }

      html.revealed, html.revealed body {
        overflow: auto;
        height: auto;
      }

      .container {
        width: 100%;
        max-width: 560px;
      }
      
      .piece {
        opacity: 0;
        will-change: transform, opacity;
      }
      
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--border);
      }

      .topbar-left {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--mid);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .topbar-right {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: var(--mid);
      }

      .profile {
        display: grid;
        grid-template-columns: 80px 1fr;
        gap: 24px;
        padding: 28px 0;
        border-bottom: 1px solid var(--border);
        align-items: start;
      }

      .avatar-wrap {
        width: 80px;
        height: 80px;
        overflow: hidden;
        position: relative;
      }

      .avatar-wrap::after {
        content: '';
        position: absolute;
        inset: 0;
        border: 1px solid rgba(0,0,0,0.1);
        pointer-events: none;
      }

      .avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        filter: grayscale(100%) contrast(1.05);
      }

      .profile-text { padding-top: 4px; }

      .name {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.02em;
        line-height: 1;
        margin-bottom: 6px;
      }

      .handle {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: var(--mid);
        margin-bottom: 12px;
      }

      .tags { display: flex; gap: 6px; flex-wrap: wrap; }

      .tag {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 3px 8px;
        border: 1px solid var(--black);
      }

      .bio {
        padding: 24px 0;
        border-bottom: 1px solid var(--border);
      }

      .bio p {
        font-size: 17px;
        font-weight: 300;
        line-height: 1.7;
        max-width: 440px;
      }

      @keyframes cursorBlink {
        0%,49% { opacity:1; } 50%,100% { opacity:0; }
      }

      .cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: var(--black);
        margin-left: 2px;
        vertical-align: text-bottom;
        animation: cursorBlink 1s step-end infinite;
      }

      .currently { padding: 24px 0; border-bottom: 1px solid var(--border); }

      .section-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mid);
        margin-bottom: 14px;
      }

      .item-list { list-style: none; }

      .item {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 8px;
        align-items: baseline;
        padding: 7px 0;
        border-top: 1px solid var(--border);
        font-size: 15px;
        font-weight: 300;
        position: relative;
      }

      .item:first-child { border-top: none; }

      .item-num {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: var(--mid);
        padding-top: 2px;
      }

      .item::after {
        content: '';
        position: absolute;
        left: 0; bottom: 0;
        width: 100%; height: 1px;
        background: var(--black);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s cubic-bezier(0.77,0,0.18,1);
      }

      .item:hover::after { transform: scaleX(1); }

      .links {
        padding: 24px 0 0;
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .link {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.05em;
        color: var(--black);
        text-decoration: none;
        padding: 8px 18px;
        border: 1px solid var(--black);
        position: relative;
        overflow: hidden;
        transition: color 0.25s;
      }

      .link::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--black);
        transform: translateY(101%);
        transition: transform 0.25s cubic-bezier(0.77,0,0.18,1);
        z-index: 0;
      }

      .link:hover::before { transform: translateY(0); }
      .link:hover { color: var(--white); }
      .link span { position: relative; z-index: 1; }

      .link-sep { width: 1px; height: 20px; background: var(--border); }

      .footer {
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .footer-left, .footer-right {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: var(--mid);
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div id="flash"></div>
    <div id="intro">
      <button id="big-btn" onclick="triggerReveal()">
        <span class="btn-text">Big Black Button</span>
      </button>
    </div>
    <div id="portfolio">
      <div class="container">
        <div class="piece" id="p-topbar">
          <div class="topbar">
            <span class="topbar-left">greatm3.tech</span>
            <span class="topbar-right">Lagos, NG &nbsp;·&nbsp; 2026</span>
          </div>
        </div>
        <div class="piece" id="p-profile">
          <div class="profile">
            <div class="avatar-wrap">
              <img src="https://pbs.twimg.com/profile_images/2008991338230910976/vstSvlVQ_400x400.jpg" alt="greatm3" class="avatar" />
            </div>
            <div class="profile-text">
              <div class="name">greatm3</div>
              <div class="handle">@0x_greatm3</div>
              <div class="tags">
                <span class="tag">Mathematics</span>
                <span class="tag">UNN</span>
                <span class="tag">100L</span>
              </div>
            </div>
          </div>
        </div>
        <div class="piece" id="p-bio">
          <div class="bio">
            <p>Maths undergrad. Learning to build. Stacking small blocks toward something that matters.<span class="cursor"></span></p>
          </div>
        </div>
        <div class="piece" id="p-currently">
          <div class="currently">
            <div class="section-label">Currently</div>
            <ul class="item-list">
              <li class="item"><span class="item-num">01</span><span>Telling my PC stuff</span></li>
              <li class="item"><span class="item-num">02</span><span>Mathematics</span></li>
              <li class="item"><span class="item-num">03</span><span>Figuring it out</span></li>
            </ul>
          </div>
        </div>

        <div class="piece" id="p-links">
          <div class="links">
            <a href="https://github.com/greatm3" target="_blank" class="link"><span>GitHub</span></a>
            <div class="link-sep"></div>
            <a href="https://x.com/0x_greatm3" target="_blank" class="link"><span>X</span></a>
          </div>
        </div>

        <div class="piece" id="p-footer">
          <div class="footer">
            <span class="footer-left">work in progress</span>
            <span class="footer-right">v0.1</span>
          </div>
        </div>

      </div>
    </div>

    <script>
      const offsets = [
        { x: -120, y: -200, r: -15 }, 
        { x:  180, y: -150, r:  12 }, 
        { x: -160, y:  80,  r:  -8 }, 
        { x:  200, y:  120, r:  10 },  
        { x: -100, y:  220, r: -12 },  
        { x:  120, y:  250, r:   8 },  
      ];

      const pieces = [
        'p-topbar','p-profile','p-bio','p-currently','p-links','p-footer'
      ];

      pieces.forEach((id, i) => {
        const el = document.getElementById(id);
        const o = offsets[i];
        el.style.transform = `translate(${o.x}px, ${o.y}px) rotate(${o.r}deg)`;
        el.style.opacity = '0';
      });

      function triggerReveal() {
        const btn = document.getElementById('big-btn');
        const intro = document.getElementById('intro');
        const flash = document.getElementById('flash');
        const portfolio = document.getElementById('portfolio');

        btn.onclick = null;
        btn.style.cursor = 'default';
        btn.style.transition = 'none';
        btn.style.background = '#fff';
        btn.style.color = '#000';

        setTimeout(() => {
          intro.style.transition = 'opacity 0.2s ease, transform 0.4s cubic-bezier(0.77,0,0.18,1)';
          intro.style.opacity = '0';
          intro.style.transform = 'scale(1.06)';
        }, 80);

        setTimeout(() => {
          intro.style.display = 'none';

          const colors = ['#ff0000', '#00cc00', '#0000ff', '#ff0000', '#00cc00'];
          let i = 0;

          function flick() {
            if (i >= colors.length) {
              flash.style.opacity = '0';
              flash.style.transition = 'opacity 0.15s';

              portfolio.style.opacity = '1';
              document.documentElement.classList.add('revealed');

              pieces.forEach((id, idx) => {
                const el = document.getElementById(id);
                setTimeout(() => {
                  el.style.transition = `transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease`;
                  el.style.transform = 'translate(0, 0) rotate(0deg)';
                  el.style.opacity = '1';
                }, idx * 90);
              });
              return;
            }

            flash.style.transition = 'none';
            flash.style.background = colors[i];
            flash.style.opacity = '0.85';

            setTimeout(() => {
              flash.style.transition = 'opacity 0.06s';
              flash.style.opacity = '0';
              i++;
              setTimeout(flick, 70);
            }, 60);
          }

          flick();

        }, 350);
      }
    </script>
  </body>
</html>
